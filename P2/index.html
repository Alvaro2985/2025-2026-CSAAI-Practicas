<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="boom.js" defer></script>

    <link rel="stylesheet" href="boom.css">    

    <title>BOOM!!</title>
</head>
<body>
    <h1>BOOM!!</h1>

    <div class="grids-container">
        <div class="grid-item">
            <div class="grid-number" id="grid-1">*</div>
        </div>
        <div class="grid-item">
            <div class="grid-number" id="grid-2">*</div>
        </div>
        <div class="grid-item">
            <div class="grid-number" id="grid-3">*</div>
        </div>
        <div class="grid-item">
            <div class="grid-number" id="grid-4">*</div>
        </div>
    </div>

    <div class="calculator-container">
        <p id="display">0:0:0</p>
        <p id="intentos">Intentos restantes: 7</p>
        <p id="info">Nueva partida preparada. Pulsa Start o un número para comenzar</p>
        
        <div class="calculator-buttons">
            <button type="button" value="7" class="digito">7</button>
            <button type="button" value="8" class="digito">8</button>
            <button type="button" value="9" class="digito">9</button>
            <button type="button" value="4" class="digito">4</button>
            <button type="button" value="5" class="digito">5</button>
            <button type="button" value="6" class="digito">6</button>
            <button type="button" value="1" class="digito">1</button>
            <button type="button" value="2" class="digito">2</button>
            <button type="button" value="3" class="digito">3</button>
            <button type="button" value="0" class="digito">0</button>
        </div>

        <div class="timer-buttons">
            <button type="button" id="start">Start</button>
            <button type="button" id="stop">Stop</button>
            <button type="button" id="reset">Reset</button>
        </div>
    </div>

</body>
</html>
